# Named sessions shown in sesh-pick (prefix f).
# A remote host is one entry, one ssh connection and one client on its tmux
# server: ssh-tmux (from agent-sidebar) reattaches to the host's last-used
# session and reconnects if the connection drops. Move between the host's
# repos on the host itself (claude-sidebar, or prefix s there), so the
# sidebar's jumps move the client on screen. claude-sidebar reads its hosts
# from ~/.config/claude-sidebar/hosts.toml and opens a host's relay in the
# session named for it there, so an entry here shares that relay only under
# the same name and with the host's `ssh` as its ssh-tmux argument. The
# remote tmux also uses C-Space: press it twice to reach it.
[[session]]
name = "mgmt-1"
path = "~"
startup_command = "ssh-tmux mgmt-1"

[[session]]
name = "dotfiles"
path = "~/dotfiles"
