# Named sessions shown in sesh-pick (prefix f).
# A remote host is one entry, one ssh connection and one client on its tmux
# server: ssh-tmux (bin/) reattaches to the host's last-used session and
# reconnects if the connection drops. Move between the host's repos on the
# host itself (workmux's sidebar, or prefix s there), so workmux's jumps
# move the client on screen. The remote tmux also uses C-Space: press it
# twice to reach it.
[[session]]
name = "mgmt-1"
path = "~"
startup_command = "ssh-tmux sysadmin@mgmt-1"

[[session]]
name = "dotfiles"
path = "~/dotfiles"
