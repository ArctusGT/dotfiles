# Named sessions shown in sesh-pick (prefix f).
# Remote repos: ssh-tmux (bin/) attaches or creates a per-repo tmux session
# on the remote and reconnects automatically if the connection drops.
# The remote tmux also uses C-Space: press C-Space twice to reach it.
[[session]]
name = "slurm-infra@mgmt-1"
path = "~"
startup_command = "ssh-tmux sysadmin@mgmt-1 slurm-infra '~/slurm-infra'"

[[session]]
name = "iot-infra@mgmt-1"
path = "~"
startup_command = "ssh-tmux sysadmin@mgmt-1 iot-infra '~/iot-infra'"

[[session]]
name = "dotfiles"
path = "~/dotfiles"
