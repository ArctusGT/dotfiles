# The Claude sessions sidebar's keys, hooks and settings for the usual tmux
# (not the frame's own, .tmux-frame.conf). A tmux config loads it with
# `source-file ~/.tmux-sidebar.conf`, then adds the waiting marker to its own
# status line as #{E:@claude_wait_marker}. Every line here sets a fixed key,
# hook index or option, so loading it again leaves the same state.
# `claude-sidebar`, and `claude-tmux-status`, which sets `@claude_wait`, are in
# the bin package; `@ssh_tmux` marks a window `ssh-tmux` opened, one showing a
# remote tmux.

# tmux picks vi or emacs copy-mode keys from $EDITOR when the server starts,
# and a server started over `ssh host tmux ...` (ssh-tmux) has no $EDITOR, so
# it got emacs keys, where a mouse drag selects but never copies. Pin vi.
set -g mode-keys vi

# A server started inside the frame (TERM_PROGRAM=tmux) sits behind a tmux
# that passes extended keys on (.tmux-frame.conf), so take them always:
# without them Shift+Enter reached Claude Code as a plain Enter. Oh my tmux!,
# for one, turns them on only for a terminal it knows, and tmux isn't one.
%if #{==:#{TERM_PROGRAM},tmux}
set -s extended-keys always
%endif

# The waiting marker: `● session:window` for each window carrying
# @claude_wait (set by the claude-tmux-status hook), in yellow, each a status
# range a click jumps to (MouseDown1Status below). Empty while none waits.
set -g @claude_wait_marker '#{S:#{W:#{?@claude_wait,#[range=user|#{window_id}#,fg=colour3#,bold]● #S:#I #[norange default],}}}'

# a = jump to Claude windows waiting for input (@claude_wait) or any other
# window with the bell flag
bind a choose-tree -Zw -f '#{||:#{@claude_wait},#{window_bell_flag}}'
# looking at a window unmarks it
set-hook -g after-select-window[10] 'set -wu @claude_wait'
set-hook -g client-session-changed[10] 'set -wu @claude_wait'
# a running claude-sidebar (tmux-frame) rebuilds at once, so its cursor follows
set-hook -g client-session-changed[11] 'run-shell -b "~/.local/bin/claude-sidebar kick"'
set-hook -g session-window-changed[11] 'run-shell -b "~/.local/bin/claude-sidebar kick"'
# a bell from an ssh-tmux window (@ssh_tmux) nobody is looking at is almost
# always a remote Claude waiting (claude-tmux-status there rings it): mark it
set-hook -g alert-bell[10] "if -F '#{&&:#{@ssh_tmux},#{||:#{==:#{window_active},0},#{==:#{session_attached},0}}}' 'set -w @claude_wait 1'"
# closing a session's last window moves its clients to the most recent other
# session rather than detaching them, which would end a tmux-frame or the
# Mac's ssh-tmux relay
set -g detach-on-destroy off

# windows: ctrl+left / ctrl+right, no prefix; in an ssh-tmux window they go to
# the remote tmux, whose windows are the ones its bar shows
bind -n C-Left if -F '#{@ssh_tmux}' 'send-keys C-Left' previous-window
bind -n C-Right if -F '#{@ssh_tmux}' 'send-keys C-Right' next-window
# panes: Cmd+arrows focus the neighbour that way. tmux wraps at a window's
# edge, so each tests pane_at_<side> first (the inner #{} in
# #{!:#{pane_at_right}} is needed: #{!:pane_at_right} reads the name as text).
# tmux reads Cmd as Alt, so ghostty/.config/ghostty/config sends these as
# Ctrl+Alt+arrow instead. In an ssh-tmux window they go to the remote tmux,
# like ctrl+left/right.
# Cmd+Left/Up/Down at an edge cross into the frame's sidebar (`claude-sidebar
# edge`): nothing outside the frame. In an ssh-tmux window the remote pane's
# edge is the one that counts, so it is asked first.
bind -n C-M-Left  if -F '#{||:#{@ssh_tmux},#{pane_at_left}}'   'run-shell -b "~/.local/bin/claude-sidebar edge left #{client_tty} #{pane_id} #{@ssh_tmux}"' 'select-pane -L'
bind -n C-M-Right if -F '#{@ssh_tmux}' 'send-keys C-M-Right' { if -F '#{!:#{pane_at_right}}'  'select-pane -R' }
bind -n C-M-Up    if -F '#{||:#{@ssh_tmux},#{pane_at_top}}'    'run-shell -b "~/.local/bin/claude-sidebar edge up #{client_tty} #{pane_id} #{@ssh_tmux}"' 'select-pane -U'
bind -n C-M-Down  if -F '#{||:#{@ssh_tmux},#{pane_at_bottom}}' 'run-shell -b "~/.local/bin/claude-sidebar edge down #{client_tty} #{pane_id} #{@ssh_tmux}"' 'select-pane -D'
# Alt+Shift+1..9 pins the repo the frame's right pane shows to the sidebar's
# entry N (`claude-sidebar pin-shown`), so the frame's M-N comes back to it;
# outside the frame it says there is none. Bound here, not in the frame,
# because inside the frame the key reaches this tmux unmatched there. Each
# under both names tmux may give it: the shifted character of a US layout,
# and M-S-N where the terminal reports the key with its modifiers. In an
# ssh-tmux window too, since the sidebar marks the remote repo on show
bind -n 'M-!' run-shell -b '~/.local/bin/claude-sidebar pin-shown 1'
bind -n 'M-@' run-shell -b '~/.local/bin/claude-sidebar pin-shown 2'
bind -n 'M-#' run-shell -b '~/.local/bin/claude-sidebar pin-shown 3'
bind -n 'M-$' run-shell -b '~/.local/bin/claude-sidebar pin-shown 4'
bind -n 'M-%' run-shell -b '~/.local/bin/claude-sidebar pin-shown 5'
bind -n 'M-^' run-shell -b '~/.local/bin/claude-sidebar pin-shown 6'
bind -n 'M-&' run-shell -b '~/.local/bin/claude-sidebar pin-shown 7'
bind -n 'M-*' run-shell -b '~/.local/bin/claude-sidebar pin-shown 8'
bind -n 'M-(' run-shell -b '~/.local/bin/claude-sidebar pin-shown 9'
bind -n M-S-1 run-shell -b '~/.local/bin/claude-sidebar pin-shown 1'
bind -n M-S-2 run-shell -b '~/.local/bin/claude-sidebar pin-shown 2'
bind -n M-S-3 run-shell -b '~/.local/bin/claude-sidebar pin-shown 3'
bind -n M-S-4 run-shell -b '~/.local/bin/claude-sidebar pin-shown 4'
bind -n M-S-5 run-shell -b '~/.local/bin/claude-sidebar pin-shown 5'
bind -n M-S-6 run-shell -b '~/.local/bin/claude-sidebar pin-shown 6'
bind -n M-S-7 run-shell -b '~/.local/bin/claude-sidebar pin-shown 7'
bind -n M-S-8 run-shell -b '~/.local/bin/claude-sidebar pin-shown 8'
bind -n M-S-9 run-shell -b '~/.local/bin/claude-sidebar pin-shown 9'
# Option+drag from one pane, released over another, swaps the two. In a mouse
# binding `=` and the default pane are both the pane under the pointer, so the
# drag's start is kept in @drag_src for the swap at its end, which run-shell -C
# expands. tmux fires M-MouseDrag1Pane once per drag, not per move, so
# @drag_src holds the start. A drag that ends over a frame pane other than
# its right one (the sidebar or a float) has @drag_src taken by `tmux-mirror
# drop`, so the release it sends swaps nothing. In an ssh-tmux window the
# drag goes to the remote tmux, which keeps its own.
bind -n M-MouseDrag1Pane if -F '#{@ssh_tmux}' 'send-keys -M' { select-pane -t = ; set -wF @drag_src '#{pane_id}' }
bind -n M-MouseDragEnd1Pane if -F '#{@ssh_tmux}' 'send-keys -M' {
  if -F '#{@drag_src}' { run-shell -t = -C 'swap-pane -d -s "#{@drag_src}" -t "#{pane_id}"' ; set -wu @drag_src }
}
# clicking a waiting marker (a range=user|@<window_id> from
# @claude_wait_marker) jumps to that window; any other status click keeps the
# default behaviour
bind -T root MouseDown1Status if -F '#{m:@*,#{mouse_status_range}}' \
  "run-shell 'tmux switch-client -c #{client_name} -t #{mouse_status_range} \\; set -wu -t #{mouse_status_range} @claude_wait'" \
  'switch-client -t ='
