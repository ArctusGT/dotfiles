# The frame: a tmux server of its own (`tmux -L frame`) that `tmux-frame`
# starts. No prefix and no status bar, so every key but the few bound below
# reaches the right pane, which runs a client of the usual tmux. The left pane
# is `claude-sidebar`.

set -g prefix None
set -g prefix2 None
# -q, as the table is gone once emptied, and a reload would say so
unbind -aq -T prefix
set -g status off

# hand the terminal's abilities through to the tmux in the right pane
set -g default-terminal tmux-256color
set -g escape-time 0
set -g focus-events on
set -g set-clipboard on
set -g extended-keys always
set -g extended-keys-format csi-u
set -as terminal-features '*:RGB'
# the default root bindings pass clicks and the wheel to the pane under them,
# but for the wheel over a mirror float (below)
set -g mouse on
# except Option+drag, whose default binding (move-pane -M) would move the
# frame's own pane: pass it on to the usual tmux, which swaps panes with it.
# Released over any other pane, `tmux-mirror drop` ends the usual tmux's drag,
# and over a floating pane makes that float mirror the drag's start pane
bind -n M-MouseDrag1Pane send-keys -M
bind -n M-MouseDragEnd1Pane if -F '#{@frame_main}' 'send-keys -M' 'run-shell -b "~/.local/bin/tmux-mirror drop #{pane_id} #{pane_floating_flag}"'
# and Option+right-click, which in the frame's default opens the frame's own
# menu, whose Kill on the right pane closes the frame: passed on, it opens the
# usual tmux's menu for the pane under it, in any program. The frame's menu
# stays on plain right-click, which reaches it only over a float, since the
# right pane and the sidebar take the mouse themselves
bind -n M-MouseDown3Pane send-keys -M
# the wheel over a float mirroring a pane (`tmux-mirror drop` sets its
# @mirror) scrolls the mirrored pane; elsewhere, tmux's default bindings,
# whose decision `tmux-mirror wheel` repeats on the mirrored pane's server
bind -n WheelUpPane if -F '#{@mirror}' { run-shell -b '~/.local/bin/tmux-mirror wheel up #{@mirror}' } {
  if -F '#{||:#{alternate_on},#{pane_in_mode},#{mouse_any_flag}}' { send-keys -M } { copy-mode -e }
}
bind -n WheelDownPane if -F '#{@mirror}' { run-shell -b '~/.local/bin/tmux-mirror wheel down #{@mirror}' } { send-keys -M }

set -g pane-border-lines single
set -g pane-active-border-style fg=colour4
set -g pane-border-style fg=colour8

# the sidebar keeps its width when the terminal resizes
set-hook -g client-resized 'resize-pane -t "{left}" -x 44'

# M-s = into the sidebar and back out, M-1..9 = jump to the sidebar's entry N
bind -n M-s if -F '#{@claude_sidebar}' 'select-pane -t "{right}"' 'select-pane -t "{left}"'
bind -n M-1 run-shell -b '~/.local/bin/claude-sidebar pick 1'
bind -n M-2 run-shell -b '~/.local/bin/claude-sidebar pick 2'
bind -n M-3 run-shell -b '~/.local/bin/claude-sidebar pick 3'
bind -n M-4 run-shell -b '~/.local/bin/claude-sidebar pick 4'
bind -n M-5 run-shell -b '~/.local/bin/claude-sidebar pick 5'
bind -n M-6 run-shell -b '~/.local/bin/claude-sidebar pick 6'
bind -n M-7 run-shell -b '~/.local/bin/claude-sidebar pick 7'
bind -n M-8 run-shell -b '~/.local/bin/claude-sidebar pick 8'
bind -n M-9 run-shell -b '~/.local/bin/claude-sidebar pick 9'
# M-Shift-1..9 = pin the repo on show to N, so M-N comes back to it; tmux
# reads the shifted digit, US layout
bind -n 'M-!' run-shell -b '~/.local/bin/claude-sidebar pin-shown 1'
bind -n 'M-@' run-shell -b '~/.local/bin/claude-sidebar pin-shown 2'
bind -n 'M-#' run-shell -b '~/.local/bin/claude-sidebar pin-shown 3'
bind -n 'M-$' run-shell -b '~/.local/bin/claude-sidebar pin-shown 4'
bind -n 'M-%' run-shell -b '~/.local/bin/claude-sidebar pin-shown 5'
bind -n 'M-^' run-shell -b '~/.local/bin/claude-sidebar pin-shown 6'
bind -n 'M-&' run-shell -b '~/.local/bin/claude-sidebar pin-shown 7'
bind -n 'M-*' run-shell -b '~/.local/bin/claude-sidebar pin-shown 8'
bind -n 'M-(' run-shell -b '~/.local/bin/claude-sidebar pin-shown 9'
# in the sidebar, Cmd+Up/Down move fzf's cursor, Cmd+Right is Enter, which
# shows the entry and focuses the right pane, and Cmd+Left does nothing;
# elsewhere the keys pass on to the usual tmux (Ghostty sends Cmd+arrows as
# Ctrl+Alt+arrow)
bind -n C-M-Left  if -F '#{!:#{@claude_sidebar}}' 'send-keys C-M-Left'
bind -n C-M-Up    if -F '#{@claude_sidebar}' 'send-keys Up'    'send-keys C-M-Up'
bind -n C-M-Down  if -F '#{@claude_sidebar}' 'send-keys Down'  'send-keys C-M-Down'
bind -n C-M-Right if -F '#{@claude_sidebar}' 'send-keys Enter' 'send-keys C-M-Right'
