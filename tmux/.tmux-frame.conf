# The frame: a tmux server of its own (`tmux -L frame`) that `tmux-frame`
# starts. No prefix and no status bar, so every key but the few bound below
# reaches the right pane, which runs a client of the usual tmux. The left pane
# is `claude-sidebar`.

set -g prefix None
set -g prefix2 None
unbind -a -T prefix
set -g status off

# hand the terminal's abilities through to the tmux in the right pane
set -g default-terminal tmux-256color
set -g escape-time 0
set -g focus-events on
set -g set-clipboard on
set -g extended-keys always
set -g extended-keys-format csi-u
set -as terminal-features '*:RGB'
# the default root bindings pass clicks and the wheel to the pane under them
set -g mouse on
# except Option+drag, whose default binding (move-pane -M) would move the
# frame's own pane: pass it on to the usual tmux, which swaps panes with it
bind -n M-MouseDrag1Pane send-keys -M

set -g pane-border-lines single
set -g pane-active-border-style fg=colour8
set -g pane-border-style fg=colour8

# the sidebar keeps its width when the terminal resizes
set-hook -g client-resized 'resize-pane -t "{left}" -x 34'

# M-s = into the sidebar and back out, M-1..9 = jump to the sidebar's entry N
bind -n M-s if -F '#{@claude_sidebar}' 'select-pane -t "{right}"' 'select-pane -t "{left}"'
bind -n M-1 run-shell -b '~/.local/bin/claude-sidebar pick 1'
bind -n M-2 run-shell -b '~/.local/bin/claude-sidebar pick 2'
bind -n M-3 run-shell -b '~/.local/bin/claude-sidebar pick 3'
bind -n M-4 run-shell -b '~/.local/bin/claude-sidebar pick 4'
bind -n M-5 run-shell -b '~/.local/bin/claude-sidebar pick 5'
bind -n M-6 run-shell -b '~/.local/bin/claude-sidebar pick 6'
bind -n M-7 run-shell -b '~/.local/bin/claude-sidebar pick 7'
bind -n M-8 run-shell -b '~/.local/bin/claude-sidebar pick 8'
bind -n M-9 run-shell -b '~/.local/bin/claude-sidebar pick 9'
