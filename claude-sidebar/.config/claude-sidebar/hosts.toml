# The remote hosts agent-sidebar's sidebar lists, in this order. `name` is
# the host's heading and the tmux session its ssh-tmux relay opens in; `ssh`
# is its ssh destination. A sesh entry kept for a host shares the sidebar's
# relay only while its name is the host's `name` and its ssh-tmux argument
# is the host's `ssh`.
[[host]]
name = "mgmt-1"
ssh = "sysadmin@mgmt-1"
